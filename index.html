<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundo dos Laços</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fffaf8;
  color: #594943;
}
header {
  background: white;
  padding: 22px;
  text-align: center;
  border-bottom: 1px solid #eee1dc;
}
header h1 { color: #a47d73; margin: 0; }
main {
  max-width: 850px;
  margin: 25px auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 3px 15px #0000000c;
  margin-bottom: 20px;
}
input, select, button {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border-radius: 8px;
  font-size: 15px;
}
input, select { border: 1px solid #e5d7d1; }
button {
  border: none;
  background: #b9948b;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: #9f776e; }
#painel { display: none; }
#mensagem { margin-top: 12px; font-size: 14px; }
table { width: 100%; border-collapse: collapse; }
th, td {
  padding: 11px 7px;
  border-bottom: 1px solid #eee1dc;
  text-align: left;
  font-size: 14px;
}
th { color: #9b7770; }
.tabela { overflow-x: auto; }
.secundario { background: #8eaaa0; }
</style>
</head>

<body>

<header>
  <h1>Mundo dos Laços</h1>
  <p>Seu espaço de gestão</p>
</header>

<main>

<div class="card" id="login">
  <h2>Bem-vinda!</h2>
  <p>Entre para acessar seu sistema.</p>
  <input id="email" type="email" placeholder="Seu e-mail"
    value="Ranifofura@gmail.com">
  <input id="senha" type="password" placeholder="Sua senha">
  <button onclick="entrar()">Entrar</button>
  <div id="mensagem"></div>
</div>

<div id="painel">

  <div class="card">
    <h2>Olá! ❤️</h2>
    <p>Bem-vinda ao painel do Mundo dos Laços.</p>
    <button class="secundario" onclick="sair()">Sair</button>
  </div>

  <div class="card">
    <h2>Cadastro de materiais</h2>

    <input id="nome" placeholder="Nome do material">

    <select id="unidade">
      <option value="">Selecione a unidade</option>
      <option value="metro">Metro</option>
      <option value="unidade">Unidade</option>
      <option value="pacote">Pacote</option>
      <option value="rolo">Rolo</option>
      <option value="par">Par</option>
    </select>

    <input id="quantidade" type="number" min="0" step="0.01"
      placeholder="Quantidade em estoque">

    <input id="custo" type="number" min="0" step="0.01"
      placeholder="Custo por unidade (R$)">

    <button onclick="cadastrarMaterial()">Salvar material</button>
    <div id="mensagemMaterial"></div>
  </div>

  <div class="card">
    <h2>Meu estoque de materiais</h2>
    <button class="secundario" onclick="carregarMateriais()">
      Atualizar estoque
    </button>
    <div class="tabela">
      <table>
        <thead>
          <tr>
            <th>Material</th>
            <th>Unidade</th>
            <th>Quantidade</th>
            <th>Custo unitário</th>
          </tr>
        </thead>
        <tbody id="listaMateriais"></tbody>
      </table>
    </div>
  </div>

</div>
</main>

<script>
const SUPABASE_URL = "https://pwtqvmazhtvokxredodz.supabase.co";
const SUPABASE_KEY = "sb_publishable_Lmz2WWP2qofJ0PTV7R77rw_CuRUHAfM";

const banco = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function entrar() {
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;
  const msg = document.getElementById("mensagem");

  msg.textContent = "Verificando acesso...";

  const { error } = await banco.auth.signInWithPassword({
    email: email,
    password: senha
  });

  if (error) {
    msg.textContent = "Não foi possível entrar. Confira seu e-mail e senha.";
    return;
  }

  mostrarPainel();
}

function mostrarPainel() {
  document.getElementById("login").style.display = "none";
  document.getElementById("painel").style.display = "block";
  carregarMateriais();
}

async function sair() {
  await banco.auth.signOut();
  document.getElementById("painel").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("senha").value = "";
}

async function cadastrarMaterial() {
  const nome = document.getElementById("nome").value.trim();
  const unidade = document.getElementById("unidade").value;
  const quantidade = Number(document.getElementById("quantidade").value);
  const custo = Number(document.getElementById("custo").value);
  const msg = document.getElementById("mensagemMaterial");

  if (!nome || !unidade ||
      document.getElementById("quantidade").value === "" ||
      document.getElementById("custo").value === "" ||
      quantidade < 0 || custo < 0) {
    msg.textContent = "Preencha todos os campos com valores válidos.";
    return;
  }

  msg.textContent = "Salvando material...";

  const { error } = await banco.from("materials").insert({
    name: nome,
    unit: unidade,
    stock_quantity: quantidade,
    cost_per_unit: custo
  });

  if (error) {
    msg.textContent = "Erro ao salvar: " + error.message;
    return;
  }

  msg.textContent = "Material cadastrado com sucesso! ❤️";

  document.getElementById("nome").value = "";
  document.getElementById("unidade").value = "";
  document.getElementById("quantidade").value = "";
  document.getElementById("custo").value = "";

  carregarMateriais();
}

async function carregarMateriais() {
  const lista = document.getElementById("listaMateriais");
  lista.innerHTML = "<tr><td colspan='4'>Carregando...</td></tr>";

  const { data, error } = await banco
    .from("materials")
    .select("*")
    .order("name");

  if (error) {
    lista.innerHTML =
      "<tr><td colspan='4'>Erro ao carregar: " +
      error.message + "</td></tr>";
    return;
  }

  if (!data || data.length === 0) {
    lista.innerHTML =
      "<tr><td colspan='4'>Nenhum material cadastrado.</td></tr>";
    return;
  }

  lista.innerHTML = "";

  data.forEach(material => {
    const linha = document.createElement("tr");

    const valores = [
      material.name,
      material.unit,
      material.stock_quantity,
      "R$ " + Number(material.cost_per_unit).toFixed(2)
    ];

    valores.forEach(valor => {
      const celula = document.createElement("td");
      celula.textContent = valor ?? "";
      linha.appendChild(celula);
    });

    lista.appendChild(linha);
  });
}

banco.auth.onAuthStateChange((evento, sessao) => {
  if (sessao) {
    mostrarPainel();
  }
});

async function verificarSessao() {
  const { data } = await banco.auth.getSession();

  if (data.session) {
    mostrarPainel();
  }
}

verificarSessao();
</script>

</body>
</html>
