<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundo dos Laços</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #faf9f7;
    color: #514943;
}

header {
    background: white;
    padding: 25px 20px;
    border-bottom: 1px solid #eee5df;
}

.logo {
    font-family: Georgia, serif;
    font-size: 27px;
    color: #9b796d;
    letter-spacing: 2px;
}

.subtitle {
    font-size: 11px;
    letter-spacing: 3px;
    color: #b99c8d;
    margin-top: 7px;
}

.container {
    padding: 25px 18px;
    max-width: 1100px;
    margin: auto;
}

h1 {
    font-family: Georgia, serif;
    font-size: 27px;
    font-weight: normal;
    margin-bottom: 8px;
}

.welcome {
    color: #9b918b;
    margin-bottom: 25px;
    font-size: 14px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
}

.card {
    background: white;
    padding: 22px 15px;
    border: 1px solid #eee6e0;
    border-radius: 9px;
    min-height: 115px;
}

.card span {
    font-size: 12px;
    color: #9b918b;
}

.card h2 {
    font-family: Georgia, serif;
    color: #9b796d;
    font-size: 25px;
    margin-top: 13px;
}

.section-title {
    font-family: Georgia, serif;
    font-size: 21px;
    margin: 30px 0 15px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.menu a {
    background: white;
    border: 1px solid #eee6e0;
    border-radius: 8px;
    padding: 19px 12px;
    color: #79665c;
    text-decoration: none;
    font-size: 14px;
}

.menu a:hover {
    background: #f5eee9;
}

footer {
    text-align: center;
    padding: 35px 10px;
    color: #b09b90;
    font-size: 11px;
    letter-spacing: 2px;
}

@media (min-width: 700px) {
    .cards {
        grid-template-columns: repeat(4, 1fr);
    }
    .menu {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>
</head>
